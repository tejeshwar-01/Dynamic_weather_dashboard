<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌤️ Premium Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Roboto&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Weather effects: sun, moon, clouds, rain, snow -->
  <div id="weather-effects">
    <div id="sun"></div>
    <div id="moon"></div>
  </div>

  <!-- Main Container -->
  <div class="container">
    <h1>🌤️ Weather Dashboard</h1>

    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter city name">
      <button id="searchBtn">Search</button>
    </div>

    <div class="weather-card" id="weather">
      <h2 id="cityName">--</h2>
      <p id="date">--</p>
      <div class="weather-main">
        <img id="icon" src="" alt="Weather Icon" />
        <div class="temperature-desc">
          <h3 id="temperature">-- °C</h3>
          <p id="description">--</p>
        </div>
      </div>
      <div class="weather-details">
        <p><b>Humidity:</b> <span id="humidity">--</span>%</p>
        <p><b>Wind:</b> <span id="wind">--</span> km/h</p>
      </div>
    </div>

    <footer>
      <p>Powered by <a href="https://openweathermap.org" target="_blank">OpenWeatherMap API</a></p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
